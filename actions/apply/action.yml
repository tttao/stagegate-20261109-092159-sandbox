name: stagegate apply
description: Verify the approved plan binding, apply each unit in dependency order and check convergence.
inputs:
  env:
    description: Environment (stage) name; units live under <units-root>/<env>.
    required: true
  units-root:
    description: Directory holding one subdirectory of Terragrunt units per environment.
    required: false
    default: stages
  binding-mode:
    description: >-
      same-job (dev and prp only; plan and apply in one job, no verification), breakglass (prod only,
      needs breakglass-incident; plan and apply in one job, no verification), encrypted_plan (verify the approved
      encrypted plans against the manifest, then apply them) or replan (re-plan, compare with the
      manifest, then apply the fresh plans).
    required: true
  breakglass-incident:
    description: Incident reference (ABC-123 or INC123). Required by, and only meaningful for, binding-mode breakglass.
    required: false
    default: ""
  only-units:
    description: Comma-separated unit names to apply (as in the plan action). Only with binding-mode same-job (break-glass always applies every unit). Use the same list as the plan action; empty applies every unit.
    required: false
    default: ""
  plan-artifact:
    description: Directory of the downloaded plan artifact (the <unit>.tfplan files, or a directory containing plans/). Required for encrypted_plan.
    required: false
    default: ""
  manifest-path:
    description: Path of the approved manifest.json. Required for encrypted_plan and replan.
    required: false
    default: ""
  encrypt:
    description: Same value as given to the plan action; the apply needs the same plan encryption.
    required: false
    default: "true"
  key-vault-key-id:
    description: Azure Key Vault key URL; the same value as given to the plan action.
    required: false
    default: ""
  engine:
    description: Engine, opentofu or terraform.
    required: false
    default: opentofu
  lock-timeout:
    description: How long each plan and apply waits for the state lock (-lock-timeout), for example 30s or 10m.
    required: false
    default: 10m
outputs:
  units-json:
    description: Path of units.json ({unit - {status, converged}}) for the ledger step. Written even when the action fails after applying.
    value: ${{ steps.apply.outputs.units-json }}
runs:
  using: composite
  steps:
    - id: apply
      shell: bash
      env:
        SG_ENV: ${{ inputs.env }}
        SG_UNITS_ROOT: ${{ inputs.units-root }}
        SG_BINDING_MODE: ${{ inputs.binding-mode }}
        SG_BREAKGLASS_INCIDENT: ${{ inputs.breakglass-incident }}
        SG_ONLY_UNITS: ${{ inputs.only-units }}
        SG_PLAN_ARTIFACT: ${{ inputs.plan-artifact }}
        SG_MANIFEST_PATH: ${{ inputs.manifest-path }}
        SG_ENCRYPT: ${{ inputs.encrypt }}
        SG_KEY_VAULT_KEY_ID: ${{ inputs.key-vault-key-id }}
        SG_ENGINE: ${{ inputs.engine }}
        SG_LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
      run: "$GITHUB_ACTION_PATH/apply.sh"
